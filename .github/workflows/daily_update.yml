name: Daily EC Data Update

on:
  schedule:
    # 毎日日本時間の朝6時 (UTCの21時) に実行
    - cron: '0 21 * * *'
  # 手動実行のトリガー
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Crawler
        run: |
          python backend/crawler.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Processor (LLM Generation)
        run: |
          python backend/processor.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Validate Generated Data
        run: |
          pytest backend/test_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/
          git commit -m "Auto-update EC data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
